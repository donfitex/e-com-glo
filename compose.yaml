services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecom -d ecom']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-bookworm
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: ['redis_data:/data']
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ecom:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/ecom?schema=public
      REDIS_URL: redis://redis:6379
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: .
    command: ['node', 'dist/workers/order-events.js']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ecom:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/ecom?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
