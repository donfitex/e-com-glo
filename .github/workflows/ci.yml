name: E-com Global CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ecom_test
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ecom -d ecom_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ecom:ci-test-only@localhost:5432/ecom_test
      TEST_DATABASE_URL: postgresql://ecom:ci-test-only@localhost:5432/ecom_test
      TEST_VECTOR_URL: postgresql://ecom:ci-test-only@localhost:5432/ecom_test
      E2E_DATABASE_URL: postgresql://ecom:ci-test-only@localhost:5432/ecom_browser_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/search-index.sql
      - run: npm run format:check
      - run: npm run check
      - run: npm --prefix storefront ci
      - run: npm run web:typecheck
      - run: npm run web:build
      - run: npx playwright install --with-deps chromium
        working-directory: storefront
      - name: Prepare isolated browser database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ecom_browser_test'
          DATABASE_URL="$E2E_DATABASE_URL" npm run prisma:migrate
          DATABASE_URL="$E2E_DATABASE_URL" npm run db:seed
          DATABASE_URL="$E2E_DATABASE_URL" ALLOW_DEMO_SEED=true npm run db:seed:demo
      - run: npm run web:test:e2e
      - run: docker build -t e-com-global:ci .

      - name: Smoke-test production API and worker containers
        env:
          REDIS_URL: redis://127.0.0.1:6379/12
          JWT_SECRET: container-ci-only-secret-at-least-32-characters
          CORS_ORIGINS: http://localhost:3001
        run: |
          set -euo pipefail
          trap 'docker rm -f ecom-ci-api ecom-ci-worker >/dev/null 2>&1 || true' EXIT
          docker run -d --name ecom-ci-api --network host -e NODE_ENV=production -e PORT=3103 -e DATABASE_URL -e REDIS_URL -e JWT_SECRET -e CORS_ORIGINS -e LOG_LEVEL=warn e-com-global:ci
          docker run -d --name ecom-ci-worker --network host -e DATABASE_URL -e REDIS_URL -e LOG_LEVEL=warn e-com-global:ci node dist/workers/order-events.js
          docker exec ecom-ci-api node -e '(async()=>{const {JwtTokens}=require("./dist/modules/auth/security");const token=new JwtTokens(process.env.JWT_SECRET).sign({sub:"e241484c-f388-4d9b-9cd7-f35ccab53280",role:"ADMIN"});for(let attempt=0;attempt<20;attempt++){try{const r=await fetch("http://127.0.0.1:3103/api/v1/admin/health",{headers:{Authorization:"Bearer "+token},signal:AbortSignal.timeout(2000)});if(r.ok&&(await r.json()).data.worker.healthy){console.log("Production API and worker smoke checks passed");return}}catch{}await new Promise(resolve=>setTimeout(resolve,1000))}process.exit(1)})().catch(()=>process.exit(1))'

      - run: docker build -f Dockerfile.staging -t e-com-global:staging-ci .
